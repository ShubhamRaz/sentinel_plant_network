name: reproducible-research-checks
on:
  push:
  pull_request:
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: pytest -q
      - name: Compile and run portable firmware protocol tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/test_firmware_host.cpp -o /tmp/test_firmware_host
          /tmp/test_firmware_host
