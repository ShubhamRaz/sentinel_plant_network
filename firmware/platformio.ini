[platformio]
default_envs = node_a, node_b, gateway
src_dir = esp32_build

[env]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
  jgromes/RadioLib@7.1.2
  adafruit/Adafruit BME280 Library@2.2.4
  adafruit/Adafruit MLX90614 Library@2.1.5
  adafruit/Adafruit Unified Sensor@1.1.15

[env:node_a]
build_src_filter = +<node_a.cpp>
build_flags =
  -DSENTINEL_NODE_ID=1
  -DSENTINEL_LORA_RST_PIN=-1
  -DSENTINEL_LORA_BUSY_PIN=-1

[env:node_b]
build_src_filter = +<node_b.cpp>
build_flags =
  -DSENTINEL_NODE_ID=2
  -DSENTINEL_LORA_RST_PIN=-1
  -DSENTINEL_LORA_BUSY_PIN=-1

[env:gateway]
build_src_filter = +<gateway.cpp>
build_flags =
  -DSENTINEL_LORA_RST_PIN=-1
  -DSENTINEL_LORA_BUSY_PIN=-1
  -DSENTINEL_START_MINUTE_OF_DAY=0
