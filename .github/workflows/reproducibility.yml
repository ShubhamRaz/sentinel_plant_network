name: reproducible-research-checks
on:
  push:
  pull_request:
permissions:
  contents: write

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: pytest -q
      - name: Verify supplementary materials and manifest checksums
        run: python scripts/verify_checksums.py
      - name: Reproduce digital-twin outputs twice and compare
        run: |
          python src/run_experiments.py --seed 20261106 --config config.json --output-dir "$RUNNER_TEMP/sentinel_run_a" > "$RUNNER_TEMP/run_a.log"
          python src/run_experiments.py --seed 20261106 --config config.json --output-dir "$RUNNER_TEMP/sentinel_run_b" > "$RUNNER_TEMP/run_b.log"
          python - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path(__import__("os").environ["RUNNER_TEMP"])
          a, b = root / "sentinel_run_a", root / "sentinel_run_b"
          rel = []
          for folder in ("data/simulated_digital_twin", "results/simulated_digital_twin"):
              for path in (a / folder).rglob("*"):
                  if path.is_file() and path.suffix in {".csv", ".json"}:
                      rel.append(path.relative_to(a))
          if not rel:
              raise SystemExit("No deterministic output files were generated")
          mismatches = []
          for relative in sorted(rel):
              left, right = a / relative, b / relative
              if not right.exists() or hashlib.sha256(left.read_bytes()).digest() != hashlib.sha256(right.read_bytes()).digest():
                  mismatches.append(str(relative))
          if mismatches:
              raise SystemExit("Non-deterministic outputs: " + ", ".join(mismatches))
          print(f"Verified {len(rel)} deterministic CSV/JSON outputs across two independent runs")
          import json
          summary = json.loads((a / "results/simulated_digital_twin/statistical_analysis_summary.json").read_text())
          print("REPEATED_MEASURES_MIXEDLM=" + json.dumps(summary["repeated_measures_lmm"], sort_keys=True))
          print("YIELD_NONINFERIORITY=" + json.dumps(summary["yield_non_inferiority_5pct"], sort_keys=True))
          diagnostics = json.loads((a / "results/simulated_digital_twin/statistical_diagnostics.json").read_text())
          print("YIELD_RCBD_DIAGNOSTICS=" + json.dumps(diagnostics["marketable_yield_t_ha"], sort_keys=True))
          PY
      - name: Compile and run portable firmware protocol tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/test_firmware_host.cpp -o /tmp/test_firmware_host
          /tmp/test_firmware_host
      - name: Compile ESP32-S3 firmware with PlatformIO
        run: |
          python -m pip install platformio==6.1.19
          pio run -c firmware/platformio.ini
      - name: Install LaTeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended
      - name: Compile journal manuscript
        run: |
          mkdir -p "$RUNNER_TEMP/manuscript"
          cd paper
          latexmk -pdf -interaction=nonstopmode -halt-on-error -file-line-error \
            -outdir="$RUNNER_TEMP/manuscript" Sentinel_Plant_Network_Journal_Paper.tex
          test -s "$RUNNER_TEMP/manuscript/Sentinel_Plant_Network_Journal_Paper.pdf"
      - name: Publish compiled manuscript PDF to this branch
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest_sha="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
          if [ "$latest_sha" != "$GITHUB_SHA" ]; then
            echo "A newer branch commit exists; skip publishing from this older run."
            exit 0
          fi
          cp "$RUNNER_TEMP/manuscript/Sentinel_Plant_Network_Journal_Paper.pdf" paper/Sentinel_Plant_Network_Journal_Paper.pdf
          if ! git diff --quiet -- paper/Sentinel_Plant_Network_Journal_Paper.pdf; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add paper/Sentinel_Plant_Network_Journal_Paper.pdf
            git commit -m "Update compiled Sentinel Plant Network manuscript [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Upload reproducible digital-twin outputs
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-digital-twin-${{ github.sha }}
          path: |
            ${{ runner.temp }}/sentinel_run_a/data/simulated_digital_twin/
            ${{ runner.temp }}/sentinel_run_a/results/simulated_digital_twin/
            ${{ runner.temp }}/sentinel_run_a/figures/simulated_digital_twin/
            ${{ runner.temp }}/manuscript/Sentinel_Plant_Network_Journal_Paper.pdf
          if-no-files-found: warn
          retention-days: 30
